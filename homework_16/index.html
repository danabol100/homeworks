<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/script.js" defer></script>
    <title>Homework 16</title>
</head>

<body>
    <div class="wrapper">
        <header class="header">
            <div class="header__container">
                <div class="header__logo">
                    <img src="img/logo.svg" class="header__image-logo" alt="logo image furniture tm">
                </div>
                <form class="header__search search-header" action="#">
                    <button type="submit" class="search-header__button"></button>
                    <input type="text" class="search-header__input" placeholder="Search something">
                </form>
                <nav class="header__menu menu">
                    <ul class="menu__list">
                        <li class="menu__item">
                            <a class="menu__link" href="#">HOME</a>
                        </li>
                        <li class="menu__item">
                            <a class="menu__link" href="#">SHOP</a>

                        </li>
                        <li class="menu__item">
                            <a class="menu__link" href="#">BLOG</a>
                        </li>
                        <li class="menu__item">
                            <a class="menu__link" href="#">ABOUT US</a>
                        </li>
                    </ul>
                </nav>


                <ul class="header__action action-header">
                    <li class="action-header__item">
                        <a href="#" class="action-header__link action-header__link--love">LOVE</a>
                    </li>
                    <li class="action-header__item">
                        <a href="#" class="action-header__link action-header__link--cart">CART</a>
                    </li>
                </ul>

                <button class="icon-menu"><span></span></button>

            </div>
        </header>
        <main>
            <div class="section-hero">
                <img class="section-hero__banner" src="img/hero-banner.png" alt="hero-banner">
                <div class="section-hero__container">
                    <div class="section-hero__content">

                        <div class="section-hero__text-content">
                            <div class="section-hero__subtitle">WELCOME TO OUR</div>
                            <h2 class="section-hero__title">
                                <span>FUNITURE</span>
                                GALLERY
                            </h2>
                            <div class="section-hero__subtitle">BROWSE OUR SELECTIONS</div>
                            <div class="section-hero__description">
                                <p>Featuring sleek designs and innovative materials that <br> seamlessly blend form and
                                    function.</p>
                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </main>
        <footer class="footer">
            <div class="footer__container">
                <p>@Footer</p>
            </div>
        </footer>
    </div>
</body>

</html>
