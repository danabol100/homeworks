<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,100;0,300;0,400;0,700;0,900;1,100;1,300;1,400;1,700;1,900&display=swap"
        rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <title>Homework 15</title>
</head>

<body>
    <header class="header">
        <div class="header__container">
            <div class="header__logo logo">
                <a href="index.html" class="logo_link">
                    <img src="img/logo.svg" alt="logo image furniture tm">
                </a>

            </div>
            <div class="header__wrapper">
                <form class="header__form">
                    <img src="img/search.svg" alt="search icon">
                    <input type="text" placeholder="Search something">
                </form>
                <nav class="header__menu menu">
                    <ul class="menu__list">
                        <li class="menu__item">
                            <a class="menu__link" href="#">HOME</a>
                        </li>
                        <li class="menu__item">
                            <a class="menu__link" href=""> <span>SHOP</span>
                                <img src="img/arrow.svg" class="menu__arrow" alt="icon arrow">
                            </a>

                        </li>
                        <li class="menu__item">
                            <a class="menu__link" href="">BLOG</a>
                        </li>
                        <li class="menu__item">
                            <a class="menu__link" href="">ABOUT US</a>
                        </li>
                    </ul>
                </nav>
            </div>
            <div class="header__action action">
                <ul class="action__list">
                    <li class="action__item">
                        <a href="#" class="action__link-item">
                            <img src="img/heart.svg" alt="heart icon">
                            <span>LOVE</span>
                        </a>
                    </li>
                    <li class="action__item">
                        <a href="#" class="action__link-item">
                            <img src="img/card.svg" alt="heart icon">
                            <span>CART</span>
                        </a>
                    </li>
                </ul>
            </div>

        </div>
    </header>
    <main>
        <div class="section-hero">
            <div class="section-hero__container">
                <div class="section-hero__content">
                    <div class="section-hero__subtitle">WELCOME TO OUR</div>
                    <h2 class="section-hero__title">
                        <span>FUNITURE</span>
                        GALLERY
                    </h2>
                    <div class="section-hero__subtitle">BROWSE OUR SELECTIONS</div>
                    <div class="section-hero__description">
                        <p>Featuring sleek designs and innovative materials that <br> seamlessly blend form and
                            function.</p>
                    </div>

                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>@Footer</p>
    </footer>
</body>

</html>
